<!doctype html>
<html lang="uz-Latn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#14213D" />
  <title>Sahifa topilmadi | ME’ROJ Mandat</title>
  <style>
    :root{color-scheme:light;--navy:#14213d;--teal:#0e7c86;--muted:#64748b;--line:#dbe3ec}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 15% 10%,#e5f2f2 0,transparent 35%),#f4f6fa;color:var(--navy);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,740px);padding:clamp(28px,6vw,64px);border:1px solid var(--line);border-radius:28px;background:#fff;box-shadow:0 22px 70px #14213d12;text-align:center}
    .brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:34px;color:var(--navy);font-size:15px;font-weight:800;letter-spacing:.12em;text-decoration:none}.mark{width:34px;height:34px;border-radius:10px;background:var(--navy);padding:5px}
    .code{margin:0;color:var(--teal);font-size:clamp(88px,19vw,150px);font-weight:800;line-height:.9;letter-spacing:-.09em}
    h1{margin:24px 0 10px;font-size:clamp(24px,4vw,36px);letter-spacing:-.04em}
    p{max-width:500px;margin:0 auto;color:var(--muted);font-size:16px;line-height:1.7}
    .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:30px 0 0}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border:1px solid var(--line);border-radius:12px;color:var(--navy);font-weight:700;text-decoration:none;transition:.2s}.primary{border-color:var(--teal);background:var(--teal);color:#fff}
    .button:hover{transform:translateY(-1px);box-shadow:0 8px 20px #14213d12}
    .links{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
    .links a{color:var(--muted);font-size:14px;text-decoration:none}.links a:hover{color:var(--teal)}
    @media(max-width:480px){main{border-radius:20px}.actions{flex-direction:column}.button{width:100%}}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="https://mandat.meroj.uz/" aria-label="ME’ROJ Mandat bosh sahifasi">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><path fill="#fff" d="M5 5 17 14c1.4 1.1 2 2.4 2 4.2v4L5 12zm30 0-12 9c-1.4 1.1-2 2.4-2 4.2v4l14-10zM5 16l7 5.6V35H5zm30 0-7 5.6V35h7z"/></svg>
      ME’ROJ <span>MANDAT</span>
    </a>
    <p class="code" aria-label="404">404</p>
    <h1>Bu sahifa topilmadi</h1>
    <p>Manzilni tekshirib ko‘ring yoki Mandat bosh sahifasidan kerakli yo‘nalishni toping.</p>
    <div class="actions"><a class="button primary" href="https://mandat.meroj.uz/">Mandat bosh sahifasi <span aria-hidden="true">&nbsp;→</span></a></div>
    <nav class="links" aria-label="ME’ROJ bo‘limlari"><a href="https://meroj.uz/">ME’ROJ bosh sahifasi ↗</a><a href="https://omr.meroj.uz/">O‘qituvchilar uchun OMR ↗</a></nav>
  </main>
</body>
</html>
